    name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Give permission to executable
        run: chmod +x gradlew

      # FIX: the action's default package list is "tools platform-tools", but Google
      # removed the "tools" package from the SDK repository, which makes sdkmanager
      # fail with "Failed to find package 'tools'". Only ask for platform-tools.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;37.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.1

      - name: Build with gradle
        run: ./gradlew clean assemble

      - name: Upload debug apks
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-debug
          path: Reef/build/outputs/apk/debug

      - name: Upload release apks
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-release
          path: Reef/build/outputs/apk/release

    

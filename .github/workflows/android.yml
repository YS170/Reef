name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Give permission to executable
        run: chmod +x gradlew

      # A stable signing key. Without it every build is signed with a brand new throwaway
      # key, so an APK can never be installed over a previous one - the user has to
      # uninstall, which wipes routines and every granted permission.
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v2

      - name: Create debug keystore if missing
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEYSTORE" ]; then
            echo "no cached keystore, generating one"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "restored cached keystore"
          fi
          keytool -list -keystore "$KEYSTORE" -storepass android | head -3

      # FIX 1: the action's default package list is "tools platform-tools", but Google
      # removed the "tools" package from the SDK repository, which makes sdkmanager
      # fail with "Failed to find package 'tools'". Only ask for platform-tools.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: 'platform-tools'

      # FIX 2: API 37 is new; it may live in a preview channel or not be published at
      # all. Never let a missing package abort the job - print what exists, try the
      # stable channel first and then the canary channel, and let Gradle report the
      # real problem if the platform is genuinely unavailable.
      - name: Install Android SDK packages
        run: |
          set -x
          sdkmanager --list | grep -E "platforms;android-3[5-9]" || true
          sdkmanager --install "platform-tools" || true
          sdkmanager --install "build-tools;37.0.0" || true
          sdkmanager --install "platforms;android-37" || sdkmanager --channel=3 --install "platforms;android-37" || true
          yes | sdkmanager --licenses || true
          ls "$ANDROID_HOME/platforms" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.1

      - name: Build with gradle
        run: ./gradlew clean assemble

      - name: Upload debug apks
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-debug
          path: Reef/build/outputs/apk/debug

      - name: Upload release apks
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-release
          path: Reef/build/outputs/apk/release
